[project]
name = "idp"
version = "1.0.0"
description = "IDP (Internal Developer Platform) - Django-based control plane with config/secret management, user authentication, and OAuth2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
    "django-ninja>=1.6.2",
    "psycopg2-binary>=2.9.12",
    "python-jose[cryptography]>=3.5.0",
    "pyjwt>=2.13.0",
    "passlib>=1.7.4",
    "bcrypt>=5.0.0",
    "python-dotenv>=1.2.2",
    "authlib>=1.7.2",
    "httpx>=0.28.1",
    "requests>=2.32.3",
    "cryptography>=49.0.0",
    "redis>=6.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]
