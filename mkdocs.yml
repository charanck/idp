site_name: IDP — Internal Developer Platform
site_description: >-
  A Go control plane for configuration/secret management, feature flags, and
  notifications, with S2S API-key auth, OAuth2/OIDC login, and a
  server-rendered web UI.
site_url: https://charanck.github.io/idp/
repo_url: https://github.com/charanck/idp
repo_name: charanck/idp
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Guides:
      - Config & Secrets: guides/config-and-secrets.md
      - Feature Flags: guides/feature-flags.md
      - Notifications: guides/notifications.md
      - Realtime events (SSE): guides/sse.md
      - In-app inbox: guides/inapp-inbox.md
  - API Reference: api.md
  - Deployment: deployment.md
  - Security: security.md
