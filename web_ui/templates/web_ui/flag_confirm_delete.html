{% extends 'web_ui/base.html' %}

{% block title %}Delete Feature Flag - Control Plane{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h3 class="text-danger">Delete Feature Flag</h3>
                <p>Are you sure you want to delete <strong>{{ flag.name }}</strong>?</p>
                <p class="text-muted mb-3">
                    Scope: <code>{{ flag.application.name }}/{{ flag.environment.name }}</code>
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'web_ui:flags_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
