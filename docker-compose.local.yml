version: "3.8"

# Local development stack. Builds the IDP image from the Dockerfile in this
# repo (instead of pulling from GHCR like docker-compose.yml does for
# staging/production), so `docker compose -f docker-compose.local.yml up`
# works out of the box on a fresh checkout.
#
# Copy .env.example to .env first, then run:
#   docker compose -f docker-compose.local.yml --env-file .env up --build

services:
  postgres:
    image: postgres:15.3-alpine
    container_name: idp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-idp}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-idp}"
      POSTGRES_DB: "${DB_NAME:-idp}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-idp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0-alpine
    container_name: idp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  idp:
    build:
      context: .
      dockerfile: Dockerfile
    image: idp:local
    container_name: idp
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DEBUG: "${DEBUG:-true}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-secret-key-change-me}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-dev-jwt-secret-change-me}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}"
      MASTER_ENCRYPTION_KEY: "${MASTER_ENCRYPTION_KEY:?Set MASTER_ENCRYPTION_KEY in .env - see README.md}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme123}"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "${DB_NAME:-idp}"
      DB_USER: "${DB_USER:-idp}"
      DB_PASSWORD: "${DB_PASSWORD:-idp}"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_BACKEND: "${CACHE_BACKEND:-redis}"
      CACHE_TIMEOUT: "${CACHE_TIMEOUT:-300}"
      CACHE_KEY_PREFIX: "${CACHE_KEY_PREFIX:-idp}"
      REDIS_URL: "redis://redis:6379/1"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DJANGO_LOG_LEVEL: "${DJANGO_LOG_LEVEL:-INFO}"

volumes:
  postgres_data:
  redis_data:
