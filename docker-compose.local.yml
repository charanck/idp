# Local development stack for the control plane. Reads .env from the repo
# root and stands up Postgres/Redis sidecars for the app.
#
# Run from the repo root:
#   docker compose -f docker-compose.local.yml --env-file .env up --build

services:
  postgres:
    image: postgres:15.3-alpine
    container_name: idp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-idp}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-idp}"
      POSTGRES_DB: "${DB_NAME:-idp}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-idp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0-alpine
    container_name: idp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
